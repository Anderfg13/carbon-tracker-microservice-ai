services:
  carbon-tracker:
    build: .
    image: carbon-tracker-microservice:local
    container_name: carbon-tracker-microservice
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - EMISSION_FACTORS_PATH=/app/config/emission-factors.json
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
